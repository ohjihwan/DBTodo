<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<title>나의 TODO 리스트</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="container">
		<input type="hidden" id="token" placeholder="JWT 토큰 (자동 입력됨)" value="" readonly><br><br>

		<h2>할 일 추가</h2>
		<input type="text" id="title" placeholder="제목"><br>
		<textarea id="description" placeholder="설명"></textarea><br>
		<button type="button" onclick="addTodo()">추가</button>
		<p id="add-result"></p>

		<h2>할 일 목록</h2>
		<button type="button" onclick="getTodos()">조회</button>
		<ul id="todo-list"></ul>

		<h2>할 일 수정</h2>
		<input type="number" id="edit-id" placeholder="할 일 ID"><br>
		<input type="text" id="edit-title" placeholder="제목"><br>
		<textarea id="edit-description" placeholder="설명"></textarea><br>
		<button type="button" onclick="updateTodo()">수정</button>
		<p id="edit-result"></p>

		<h2>할 일 삭제</h2>
		<input type="number" id="delete-id" placeholder="할 일 ID"><br>
		<button type="button" onclick="deleteTodo()">삭제</button>
		<p id="delete-result"></p>

		<button type="button" onclick="goToLogin()" class="login-go">로그인 화면으로</button>
	</div>

	<script>
		const token = localStorage.getItem('token');
		document.getElementById('token').value = token;

		async function addTodo() {
			const title = document.getElementById('title').value;
			const description = document.getElementById('description').value;

			const res = await fetch('http://localhost:3000/api/todos', {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json',
					'Authorization': 'Bearer ' + token
				},
				body: JSON.stringify({ title, description })
			});

			if (!title.trim() || !description.trim()) {
				alert('제목과 설명을 모두 입력해 주세요.');
				return;
			}

			const data = await res.json();
			document.getElementById('add-result').innerText = data.message || data.error;
		}

		async function getTodos() {
			try {
				const res = await fetch('http://localhost:3000/api/todos', {
					headers: {
						'Authorization': 'Bearer ' + token
					}
				});

				if (!res.ok) {
					const text = await res.text();
					alert(`조회 실패: ${text}`);
					return;
				}

				const todos = await res.json();
				const list = document.getElementById('todo-list');
				list.innerHTML = '';

				if (todos.length === 0) {
					const li = document.createElement('li');
					li.textContent = '할 일이 없습니다.';
					list.appendChild(li);
					return;
				}

				todos.forEach(todo => {
					const li = document.createElement('li');

					// 완료 상태만 시각적으로 표시 (UX 배려)
					const status = todo.is_done === 1 ? '✅ ' : '';

					li.textContent = `${status}[#${todo.id}] ${todo.title} - ${todo.description}`;
					list.appendChild(li);
				});
			} catch (err) {
				alert('조회 중 오류 발생: ' + err.message);
			}
		}

		async function updateTodo() {
			const id = document.getElementById('edit-id').value;
			const title = document.getElementById('edit-title').value;
			const description = document.getElementById('edit-description').value;

			const res = await fetch(`http://localhost:3000/api/todos/${id}`, {
				method: 'PUT',
				headers: {
					'Content-Type': 'application/json',
					'Authorization': 'Bearer ' + token
				},
				body: JSON.stringify({ title, description })
			});

			if (!id || !title.trim() || !description.trim()) {
				alert('ID, 제목, 설명을 모두 입력해 주세요.');
				return;
			}

			const data = await res.json();
			document.getElementById('edit-result').innerText = data.message || data.error;
		}

		async function deleteTodo() {
			const id = document.getElementById('delete-id').value.trim();

			if (!id) {
				alert('삭제할 할 일 ID를 입력해 주세요.');
				return;
			}

			try {
				const res = await fetch(`http://localhost:3000/api/todos/${id}`, {
					method: 'DELETE',
					headers: {
						'Authorization': 'Bearer ' + token
					}
				});

				if (!res.ok) {
					const text = await res.text();
					alert(`삭제 실패: ${text}`);
					return;
				}

				const data = await res.json();
				document.getElementById('delete-result').innerText = data.message || '삭제 완료';
				getTodos(); // 목록 갱신
			} catch (err) {
				alert('예기치 못한 오류 발생: ' + err.message);
			}
		}

		function goToLogin() {
			localStorage.removeItem('token');
			window.location.href = 'index.html';
		}
	</script>
</body>
</html>
