<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>할 일 테스트</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <input type="hidden" id="token" placeholder="JWT 토큰 (자동 입력됨)" value="" readonly title="로그인 토큰"><br><br>

        <h2>할 일 추가</h2>
        <input type="text" id="title" placeholder="제목"><br>
        <textarea id="description" placeholder="설명"></textarea><br>
        <button type="button" onclick="addTodo()">추가</button>
        <p id="add-result"></p>

        <h2>할 일 목록</h2>
        <button type="button" onclick="getTodos()">조회</button>
        <ul id="todo-list"></ul>

        <h2>할 일 수정</h2>
        <input type="number" id="edit-id" placeholder="할 일 ID"><br>
        <input type="text" id="edit-title" placeholder="제목"><br>
        <textarea id="edit-description" placeholder="설명"></textarea><br><br>

        <button type="button" onclick="updateTodo()">수정</button>
        <p id="edit-result"></p>

        <h2>할 일 삭제</h2>
        <input type="number" id="delete-id" placeholder="할 일 ID"><br>
        <button type="button" onclick="deleteTodo()">삭제</button>
        <p id="delete-result"></p>

        <button type="button" onclick="goToLogin()" class="login-go">로그인 화면으로</button>
    </div>
    <script>
        const token = localStorage.getItem('token');
        document.getElementById('token').value = token;

        async function addTodo() {
            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;

            const res = await fetch('http://localhost:3000/api/todos', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ title, description })
            });

            const data = await res.json();
            document.getElementById('add-result').innerText = data.message || data.error;
        }

        async function getTodos() {
            const res = await fetch('http://localhost:3000/api/todos', {
                headers: {
                    'Authorization': 'Bearer ' + token
                }
            });
            const data = await res.json();

            const list = document.getElementById('todo-list');
            list.innerHTML = '';
            data.forEach(todo => {
                const li = document.createElement('li');
                li.innerText = `[#${todo.id}] ${todo.title} - ${todo.description} (완료: ${todo.is_done})`;
                list.appendChild(li);
            });
        }

        async function updateTodo() {
            const id = document.getElementById('edit-id').value;
            const title = document.getElementById('edit-title').value;
            const description = document.getElementById('edit-description').value;

            const res = await fetch(`http://localhost:3000/api/todos/${id}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
            });

            const data = await res.json();
            document.getElementById('edit-result').innerText = data.message || data.error;
        }

        async function deleteTodo() {
            const id = document.getElementById('delete-id').value;

            const res = await fetch(`http://localhost:3000/api/todos/${id}`, {
                method: 'DELETE',
                headers: {
                    'Authorization': 'Bearer ' + token
                }
            });

            const data = await res.json();
            document.getElementById('delete-result').innerText = data.message || data.error;
        }

        function goToLogin() {
            localStorage.removeItem('token'); // 자동 로그인 방지
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
