<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>로그인</h2>
        <input type="text" id="login-username" placeholder="아이디"><br>
        <input type="password" id="login-password" placeholder="비밀번호"><br>
        <button type="button" onclick="login()">로그인</button>
        <button type="button" onclick="goToSignup()">회원가입</button>
        <p id="login-result"></p>
    </div>

    <script>
        async function login() {
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;

            const res = await fetch('http://localhost:3000/api/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username, password })
            });

            const data = await res.json();
            if (res.ok && data.token) {
                localStorage.setItem('token', data.token);
                window.location.href = 'todo.html';
            } else {
                document.getElementById('login-result').innerText = data.message || data.error;
            }
        }

        function goToSignup() {
            window.location.href = 'signup.html';
        }
    </script>
</body>
</html>
